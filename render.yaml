# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gan-hadar
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: YT_DLP_PATH
        value: yt-dlp